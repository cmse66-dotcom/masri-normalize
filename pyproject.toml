[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "masri-normalize"
version = "0.1.0"
description = "تنضيف وتطبيع النص المصري (تشكيل، تطويل، حروف مكررة، أرقام، عربيزي) قبل استخدامه مع نماذج الذكاء الاصطناعي"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Mohammed Sultan" }]
keywords = ["arabic", "egyptian", "nlp", "normalization", "masri", "text-cleaning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Natural Language :: Arabic",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/cmse66-dotcom/masri-normalize"

[tool.setuptools.packages.find]
include = ["masri_normalize*"]

[tool.setuptools.package-dir]
"" = "."
